<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__TITLE__</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    input[type="range"] { height: 5px; }
    .pill-btn[data-active="true"], .tab-btn[data-active="true"] {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }
    .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.35); border-radius: 3px; }
    .ik-handle { cursor: grab; }
    .ik-handle:active { cursor: grabbing; }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased m-0 p-0">
  <div class="min-h-screen flex flex-col">
    <!-- Top Bar -->
    <header class="px-4 py-2.5 border-b border-[var(--border)] bg-[var(--card)] flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div id="badgeIcon" class="w-8 h-8 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] flex items-center justify-center font-bold text-sm">✂</div>
        <div>
          <div id="hdrTitle" class="font-semibold text-sm leading-tight"></div>
          <div id="hdrSub" class="text-xs text-[var(--muted-foreground)]"></div>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1.5 text-xs">
        <div id="presetBar" class="flex flex-wrap items-center gap-1.5"></div>
        <span class="mx-1 text-[var(--border)]">|</span>
        <button id="btnFlip" class="px-2 py-1.5 rounded-md border border-[var(--border)] bg-[var(--background)] font-medium">⇄ Lật</button>
        <button id="btnPlay" class="px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--background)] font-medium">⏸ Tạm dừng</button>
        <select id="selSpeed" class="px-2 py-1.5 rounded-md border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)]">
          <option value="1">1.0×</option>
          <option value="0.5">0.5×</option>
          <option value="0.25">0.25×</option>
        </select>
      </div>
    </header>

    <!-- Main Split -->
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12">
      <!-- Shadow-Box Stage -->
      <main class="lg:col-span-8 flex flex-col border-b lg:border-b-0 lg:border-r border-[var(--border)]">
        <div id="stageWrap" class="relative flex-1 min-h-[520px] bg-[var(--content)] flex items-center justify-center p-3 sm:p-5 overflow-hidden select-none">
          <div class="w-full max-w-[920px] aspect-[4/3] rounded-xl shadow-2xl border-[5px] border-[#f4f4f2] overflow-hidden relative" id="stageBox">
            <svg id="sceneSvg" viewBox="0 0 960 720" class="w-full h-full block">
              <defs id="svgDefs"></defs>
              <clipPath id="stageClip"><rect x="0" y="0" width="960" height="720"/></clipPath>
              <g clip-path="url(#stageClip)">
                <g id="layerSky"></g>
                <g id="layerAmbientBack"></g>
                <g id="layerCelestial"></g>
                <g id="layerLightShafts"></g>
                <g id="layerBackScenery"></g>
                <g id="layerMistMid"></g>
                <g id="layerSwarmBack"></g>
                <g id="layerFallingBack"></g>
                <g id="layerGroundShadows"></g>
                <g id="layerHeroes"></g>
                <g id="layerVfx"></g>
                <g id="layerFrontScenery"></g>
                <g id="layerSwarmFront"></g>
                <g id="layerFallingFront"></g>
                <g id="layerAtmosphereFore"></g>
                <g id="layerFrame"></g>
                <g id="layerCorners"></g>
                <g id="layerOverlayProps"></g>
                <g id="layerDiag"></g>
                <g id="layerIk"></g>
              </g>
            </svg>

            <!-- Bottom Stage Toggles -->
            <div class="absolute bottom-3 left-3 flex flex-wrap items-center gap-2 text-xs bg-[var(--card)]/90 backdrop-blur px-2.5 py-1.5 rounded-lg border border-[var(--border)] shadow">
              <label class="flex items-center gap-1 cursor-pointer"><input id="chkBones" type="checkbox" class="accent-[var(--primary)]"> Khung xương</label>
              <label class="flex items-center gap-1 cursor-pointer"><input id="chkAnchors" type="checkbox" class="accent-[var(--primary)]"> Anchors</label>
              <label class="flex items-center gap-1 cursor-pointer"><input id="chkParallax" type="checkbox" checked class="accent-[var(--primary)]"> Parallax 3D</label>
              <label class="flex items-center gap-1 cursor-pointer"><input id="chkAtmos" type="checkbox" checked class="accent-[var(--primary)]"> Ánh sáng</label>
              <label class="flex items-center gap-1 cursor-pointer"><input id="chkFrame" type="checkbox" checked class="accent-[var(--primary)]"> Khung giấy</label>
              <label class="flex items-center gap-1 cursor-pointer"><input id="chkCorners" type="checkbox" checked class="accent-[var(--primary)]"> Mây/Góc</label>
            </div>

            <div class="absolute bottom-3 right-3 flex items-center gap-1 text-xs bg-[var(--card)]/90 backdrop-blur px-2 py-1 rounded-lg border border-[var(--border)] shadow">
              <button id="btnZoomOut" class="px-1.5 py-0.5 rounded hover:bg-[var(--background)]">−</button>
              <span id="zoomLabel" class="font-mono tabular-nums w-10 text-center">100%</span>
              <button id="btnZoomIn" class="px-1.5 py-0.5 rounded hover:bg-[var(--background)]">+</button>
            </div>

            <div id="phaseBadge" class="absolute top-3 left-3 text-[11px] font-mono px-2.5 py-1 rounded-md bg-[var(--card)]/85 backdrop-blur border border-[var(--border)] text-[var(--muted-foreground)]"></div>
          </div>
        </div>
      </main>

      <!-- Inspector -->
      <aside class="lg:col-span-4 bg-[var(--card)] flex flex-col max-h-[720px]">
        <div class="p-2 border-b border-[var(--border)] grid grid-cols-3 gap-1.5 text-xs">
          <button class="tab-btn py-1.5 rounded-md border border-[var(--border)] font-medium" data-tab="rig" data-active="true">Khớp Rig</button>
          <button class="tab-btn py-1.5 rounded-md border border-[var(--border)] font-medium" data-tab="scene" data-active="false">Cảnh &amp; Ánh sáng</button>
          <button class="tab-btn py-1.5 rounded-md border border-[var(--border)] font-medium" data-tab="spec" data-active="false">Cấu trúc &amp; JSON</button>
        </div>

        <div id="tab-rig" class="p-3.5 space-y-3 overflow-y-auto scroll-thin flex-1 text-xs">
          <!-- Multi-rig switcher -->
          <div id="rigSwitcher" class="hidden flex flex-wrap gap-1.5 pb-2 border-b border-[var(--border)]"></div>
          <div id="variantSection" class="space-y-2 hidden pb-2 border-b border-[var(--border)]"></div>
          <div class="flex items-center justify-between text-[var(--muted-foreground)]">
            <span>Kéo thanh trượt để chỉnh từng khớp (FK)</span>
            <button id="btnRest" class="px-2 py-0.5 rounded border border-[var(--border)] hover:border-[var(--primary)]">↺ Nghỉ</button>
          </div>
          <div id="rootControls" class="space-y-2 pb-2 border-b border-[var(--border)]"></div>
          <div id="boneSliders" class="space-y-2"></div>
        </div>

        <div id="tab-scene" class="hidden p-3.5 space-y-3.5 overflow-y-auto scroll-thin flex-1 text-xs">
          <div class="space-y-2">
            <div class="font-semibold">Ánh sáng &amp; Bóng cắt giấy</div>
            <label class="flex items-center gap-2">
              <span class="w-28 text-[var(--muted-foreground)]">Độ sâu bóng giấy</span>
              <input id="rngShadow" type="range" min="0.2" max="1.8" step="0.1" value="1" class="flex-1 accent-[var(--primary)]"/>
              <span id="valShadow" class="w-10 text-right font-mono">1.0×</span>
            </label>
            <label class="flex items-center gap-2">
              <span class="w-28 text-[var(--muted-foreground)]">Nhịp gió &amp; cảnh</span>
              <input id="rngAmbient" type="range" min="0" max="2.2" step="0.1" value="1" class="flex-1 accent-[var(--primary)]"/>
              <span id="valAmbient" class="w-10 text-right font-mono">1.0×</span>
            </label>
            <label class="flex items-center justify-between pt-1">
              <span class="text-[var(--muted-foreground)]">Hiệu ứng trời (Sao băng / Đom đóm / Lá rơi)</span>
              <input id="chkAmbient" type="checkbox" checked class="accent-[var(--primary)]"/>
            </label>
            <label class="flex items-center justify-between">
              <span class="text-[var(--muted-foreground)]">Đàn sinh vật nhỏ (Chim / Cá)</span>
              <input id="chkSwarm" type="checkbox" checked class="accent-[var(--primary)]"/>
            </label>
            <label class="flex items-center justify-between">
              <span class="text-[var(--muted-foreground)]">Nhịp thở máy quay điện ảnh</span>
              <input id="chkCamBreath" type="checkbox" checked class="accent-[var(--primary)]"/>
            </label>
          </div>
        </div>

        <div id="tab-spec" class="hidden p-3.5 space-y-3 overflow-y-auto scroll-thin flex-1 text-xs">
          <div id="specSummary" class="p-2.5 rounded-lg bg-[var(--background)] border border-[var(--border)] space-y-1"></div>
          <div class="space-y-1">
            <div class="font-semibold">Cây xương Rig</div>
            <pre id="boneTreeOut" class="p-2 rounded bg-[var(--background)] border border-[var(--border)] font-mono text-[11px] overflow-x-auto leading-relaxed"></pre>
          </div>
          <div class="space-y-1">
            <div class="flex items-center justify-between">
              <span class="font-semibold">Pose JSON hiện tại</span>
              <button id="btnCopyPose" class="px-2 py-0.5 rounded border border-[var(--border)] hover:border-[var(--primary)]">Copy</button>
            </div>
            <pre id="poseJsonOut" class="p-2 rounded bg-[var(--background)] border border-[var(--border)] font-mono text-[11px] max-h-44 overflow-auto"></pre>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const BLUEPRINT = __BLUEPRINT_JSON__;

    // Deterministic Park-Miller LCG (strictly seeded, zero non-deterministic RNG)
    function makeRng(seed) {
      let s = (seed >>> 0) || 4219;
      return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    }
    const DEG = Math.PI / 180;
    const RAD = 180 / Math.PI;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const smoothstep = (t) => { const c = clamp(t, 0, 1); return c * c * (3 - 2 * c); };
    const easeOutBack = (t) => {
      const c = clamp(t, 0, 1);
      const c1 = 1.35, c3 = c1 + 1;
      return 1 + c3 * Math.pow(c - 1, 3) + c1 * Math.pow(c - 1, 2);
    };

    // Normalize single rig or multi-rig rigs[]
    const RAW_RIGS = Array.isArray(BLUEPRINT.rigs) && BLUEPRINT.rigs.length > 0
      ? BLUEPRINT.rigs
      : [BLUEPRINT.rig];
    const PART_BY_ID = Object.fromEntries(BLUEPRINT.parts.map(p => [p.id, p]));

    function topoSort(rawBones) {
      const out = [];
      const byParent = new Map();
      for (const b of rawBones) {
        const k = b.parent ?? '__root__';
        byParent.set(k, [...(byParent.get(k) ?? []), b]);
      }
      const visit = (pid) => {
        for (const b of byParent.get(pid) ?? []) {
          out.push(b);
          visit(b.id);
        }
      };
      visit('__root__');
      return out;
    }

    const RIGS = RAW_RIGS.map((r) => {
      const bones = topoSort(r.bones);
      return {
        ...r,
        label: r.label ?? r.characterId ?? r.id,
        bones,
        boneById: Object.fromEntries(bones.map(b => [b.id, b])),
      };
    });
    const RIG_BY_ID = Object.fromEntries(RIGS.map(r => [r.id, r]));

    // Per-rig runtime state
    const rigStates = {};
    for (const r of RIGS) {
      rigStates[r.id] = {
        rootX: r.rootPos?.x ?? 480,
        rootY: r.rootPos?.y ?? 420,
        facing: r.facing ?? 1,
        scale: r.scale ?? 1,
        breath: 0,
        angles: Object.fromEntries(r.bones.map(b => [b.id, b.rest ?? 0])),
        variants: Object.fromEntries(Object.entries(r.variants ?? {}).map(([k, list]) => [k, list[0]])),
        emote: null,
      };
    }

    const state = {
      activeRigId: RIGS[0].id,
      preset: BLUEPRINT.motions?.[0]?.id ?? 'manual',
      playing: true,
      speed: 1,
      time: 0,
      zoom: 1,
      showBones: false,
      showAnchors: false,
      parallax: true,
      showAtmos: true,
      showFrame: true,
      showCorners: true,
      showAmbient: true,
      showSwarm: true,
      camBreath: true,
      shadowScale: 1,
      ambientAmp: 1,
      pointer: { x: 0, y: 0 },
      smoothPtr: { x: 0, y: 0 },
      draggingIk: null,
      vfx: { splash: 0, splashX: 480, bubbles: 0, glowSpot: 0, glowX: 520, glowY: 460 },
    };

    // Header & Defs setup
    document.getElementById('badgeIcon').textContent = BLUEPRINT.meta.icon ?? '✂';
    document.getElementById('hdrTitle').textContent = BLUEPRINT.meta.title;
    document.getElementById('hdrSub').textContent = BLUEPRINT.meta.subtitle ?? '';
    document.getElementById('stageBox').style.background = BLUEPRINT.scene.bgColor ?? '#0b1326';

    const baseDefs = `
      <filter id="paperTex" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" seed="${BLUEPRINT.meta.seed ?? 13}" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0 0.10  0 0 0 0.08 0" result="g"/>
        <feComposite in="g" in2="SourceGraphic" operator="in" result="gc"/>
        <feBlend in="SourceGraphic" in2="gc" mode="multiply"/>
      </filter>
      <filter id="shadowDeep" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow id="fDeep" dx="0" dy="8" stdDeviation="9" flood-color="#050712" flood-opacity="0.56"/>
      </filter>
      <filter id="shadowMed" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow id="fMed" dx="2" dy="5" stdDeviation="5.5" flood-color="#070a16" flood-opacity="0.40"/>
      </filter>
      <filter id="shadowSoft" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow id="fSoft" dx="0" dy="4" stdDeviation="5" flood-color="#141828" flood-opacity="0.24"/>
      </filter>
      <!-- Ultra-subtle internal depth crease (never cuts ugly black seams across limbs/tails!) -->
      <filter id="shadowInner" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#1a0d12" flood-opacity="0.14"/>
      </filter>
      <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%">
        <feGaussianBlur stdDeviation="10" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="groundShadowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#120810" stop-opacity="0.42"/>
        <stop offset="60%" stop-color="#120810" stop-opacity="0.16"/>
        <stop offset="100%" stop-color="#120810" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="warmMomentGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffe799" stop-opacity="0.42"/>
        <stop offset="55%" stop-color="#f79f4d" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#f79f4d" stop-opacity="0"/>
      </radialGradient>
      ${BLUEPRINT.scene.defsSvg ?? ''}`;
    document.getElementById('svgDefs').innerHTML = baseDefs;

    document.getElementById('layerFrame').innerHTML = BLUEPRINT.scene.frameSvg ?? '';
    document.getElementById('layerCorners').innerHTML = BLUEPRINT.scene.cornersSvg ?? '';

    // Pre-generate deterministic stars & falling particles
    const rng = makeRng(BLUEPRINT.meta.seed ?? 4219);
    const STARS = [];
    const starCount = BLUEPRINT.scene.stars?.count ?? 0;
    for (let i = 0; i < starCount; i++) {
      STARS.push({
        x: 35 + rng() * 890,
        y: 35 + rng() * (BLUEPRINT.scene.stars.maxY ?? 440),
        r: 0.7 + rng() * 1.9,
        op: 0.3 + rng() * 0.65,
        phase: rng() * 6.28,
        freq: 1.2 + rng() * 2.2,
      });
    }

    // Pre-generate falling leaves/petals/snow particles deterministically
    const FALLING_PARTICLES = [];
    for (const em of (BLUEPRINT.scene.emitters ?? []).filter(e => e.type === 'falling')) {
      const fr = makeRng(em.seed ?? 5511);
      const shapes = em.shapesSvg ?? [
        '<path d="M0 -8 C3 -4 7 -3 8 0 C5 2 4 6 0 9 C-4 6 -5 2 -8 0 C-7 -3 -3 -4 0 -8 Z" fill="CURRENT"/>'
      ];
      const colors = em.colors ?? ['#f27138', '#f7b249', '#d94432', '#ffd166'];
      const count = em.count ?? 22;
      for (let i = 0; i < count; i++) {
        FALLING_PARTICLES.push({
          lane: i % 3 === 0 ? 'front' : 'back',
          x0: fr() * 1100 - 70,
          y0: fr() * 760 - 40,
          vy: (em.speedY ?? 32) * (0.65 + fr() * 0.7),
          vx: (em.windX ?? -26) * (0.7 + fr() * 0.6),
          swayAmp: (em.swayAmp ?? 24) * (0.6 + fr() * 0.8),
          swayFreq: 1.1 + fr() * 1.4,
          spinFreq: (fr() > 0.5 ? 1 : -1) * (1.2 + fr() * 1.8),
          tumbleFreq: 1.5 + fr() * 1.6,
          phase: fr() * 6.28,
          scale: (em.scale ?? 1) * (0.62 + fr() * 0.65),
          svg: shapes[i % shapes.length].replace(/CURRENT/g, colors[i % colors.length]),
        });
      }
    }

    function resolvePartId(rigObj, bone) {
      const rs = rigStates[rigObj.id];
      if (bone.variantGroup && bone.variants) {
        const sel = rs.variants[bone.variantGroup];
        if (sel && bone.variants[sel]) return bone.variants[sel];
      }
      return bone.part;
    }

    function computeWorld(rigObj) {
      const rs = rigStates[rigObj.id];
      const world = {};
      for (const b of rigObj.bones) {
        const localDeg = rs.angles[b.id] ?? 0;
        if (b.parent === null) {
          world[b.id] = { x: rs.rootX, y: rs.rootY, deg: localDeg };
        } else {
          const pWorld = world[b.parent];
          const pBone = rigObj.boneById[b.parent];
          const pPart = PART_BY_ID[resolvePartId(rigObj, pBone)];
          const anc = pPart?.anchors?.[b.attach] ?? pPart?.pivot ?? [0, 0];
          const piv = pPart?.pivot ?? [0, 0];
          const lx = (anc[0] - piv[0]) * rs.scale;
          const ly = (anc[1] - piv[1]) * rs.scale;
          const r = pWorld.deg * DEG;
          const c = Math.cos(r), s = Math.sin(r);
          world[b.id] = {
            x: pWorld.x + lx * c - ly * s,
            y: pWorld.y + lx * s + ly * c,
            deg: pWorld.deg + localDeg,
          };
        }
      }
      return world;
    }

    function solveIk(rigObj, chain, target) {
      const rs = rigStates[rigObj.id];
      const world = computeWorld(rigObj);
      const uBone = rigObj.boneById[chain.upper];
      const lBone = rigObj.boneById[chain.lower];
      const uPart = PART_BY_ID[resolvePartId(rigObj, uBone)];
      const lPart = PART_BY_ID[resolvePartId(rigObj, lBone)];
      const uAnc = uPart.anchors[lBone.attach];
      const lAnc = lPart.anchors[rigObj.boneById[chain.end].attach];
      const L1 = Math.hypot(uAnc[0] - uPart.pivot[0], uAnc[1] - uPart.pivot[1]) * rs.scale;
      const L2 = Math.hypot(lAnc[0] - lPart.pivot[0], lAnc[1] - lPart.pivot[1]) * rs.scale;
      const baseAngleOffset = Math.atan2(uAnc[1] - uPart.pivot[1], uAnc[0] - uPart.pivot[0]);
      const origin = world[chain.upper];
      const pDeg = world[uBone.parent].deg;
      const dx = target.x - origin.x, dy = target.y - origin.y;
      const d = clamp(Math.hypot(dx, dy), Math.abs(L1 - L2) + 1, L1 + L2 - 0.5);
      const aim = Math.atan2(dy, dx);
      const a = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
      const b = Math.acos(clamp((L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2), -1, 1));
      const bend = chain.bend ?? 1;
      let uLocal = (aim + bend * a - baseAngleOffset) * RAD - pDeg;
      while (uLocal > 180) uLocal -= 360;
      while (uLocal < -180) uLocal += 360;
      const lLocal = -bend * (Math.PI - b) * RAD;
      rs.angles[chain.upper] = clamp(uLocal, uBone.limits.min, uBone.limits.max);
      rs.angles[chain.lower] = clamp(lLocal, lBone.limits.min, lBone.limits.max);
    }

    function applyPhaseToRig(rigObj, spec, localT, t) {
      if (!spec) return;
      const rs = rigStates[rigObj.id];
      const e = spec.ease === 'back' ? easeOutBack(localT) : smoothstep(localT);
      if (spec.rootX) rs.rootX = lerp(spec.rootX[0], spec.rootX[1], e);
      if (spec.rootY) rs.rootY = lerp(spec.rootY[0], spec.rootY[1], e) - (spec.arcY ? Math.sin(localT * Math.PI) * spec.arcY : 0);
      if (spec.facing != null) rs.facing = spec.facing;
      rs.emote = spec.emote ?? null;
      rs.breath = Math.sin(t * 2.4 + (rigObj.id.length * 0.7)) * 0.018;

      for (const b of rigObj.bones) {
        const k = spec.bones?.[b.id];
        if (Array.isArray(k)) rs.angles[b.id] = lerp(k[0], k[1], e);
        else if (typeof k === 'number') rs.angles[b.id] = k;
        const wv = spec.waves?.[b.id];
        if (wv) rs.angles[b.id] = (rs.angles[b.id] ?? 0) + Math.sin(t * wv.freq + (wv.phase ?? 0)) * wv.amp;
        rs.angles[b.id] = clamp(rs.angles[b.id], b.limits.min, b.limits.max);
      }
    }

    function evalMotion(t) {
      const m = (BLUEPRINT.motions ?? []).find(x => x.id === state.preset);
      if (!m) return;
      state.vfx.splash = 0; state.vfx.bubbles = 0; state.vfx.glowSpot = 0;

      if (m.type === 'cycle' && Array.isArray(m.phases)) {
        const period = m.period ?? 10;
        const u = ((t % period) + period) % period / period;
        let phase = m.phases[m.phases.length - 1];
        let localT = 0;
        for (const ph of m.phases) {
          if (u >= ph.from && u <= ph.to) {
            phase = ph;
            localT = (u - ph.from) / Math.max(0.0001, ph.to - ph.from);
            break;
          }
        }
        if (phase.label) document.getElementById('phaseBadge').textContent = phase.label;

        if (phase.rigs) {
          for (const r of RIGS) applyPhaseToRig(r, phase.rigs[r.id], localT, t);
        } else {
          applyPhaseToRig(RIGS[0], phase, localT, t);
        }

        if (phase.vfx) {
          if (phase.vfx.splashAtY != null) {
            const r0 = rigStates[RIGS[0].id];
            const dist = Math.abs(r0.rootY - phase.vfx.splashAtY);
            if (dist < 95) { state.vfx.splash = 1 - dist / 95; state.vfx.splashX = r0.rootX; }
          }
          if (phase.vfx.bubbles) state.vfx.bubbles = Math.sin(localT * Math.PI) * phase.vfx.bubbles;
          if (phase.vfx.warmGlow) {
            state.vfx.glowSpot = Math.sin(localT * Math.PI) * (phase.vfx.warmGlow.intensity ?? 1);
            state.vfx.glowX = phase.vfx.warmGlow.x ?? 520;
            state.vfx.glowY = phase.vfx.warmGlow.y ?? 470;
          }
        }
      } else if (m.type === 'harmonic') {
        if (m.label) document.getElementById('phaseBadge').textContent = m.label;
        const applyHarmonic = (r, hm) => {
          if (!hm) return;
          const rs = rigStates[r.id];
          const bx = r.rootPos?.x ?? 480, by = r.rootPos?.y ?? 420;
          rs.rootX = bx + (hm.rootWaveX ? Math.sin(t * hm.rootWaveX.freq + (hm.rootWaveX.phase ?? 0)) * hm.rootWaveX.amp : 0);
          rs.rootY = by + (hm.rootWaveY ? Math.sin(t * hm.rootWaveY.freq + (hm.rootWaveY.phase ?? 0)) * hm.rootWaveY.amp : 0);
          rs.breath = Math.sin(t * 2.2) * 0.02;
          for (const b of r.bones) {
            let deg = hm.base?.[b.id] ?? b.rest ?? 0;
            const wv = hm.waves?.[b.id];
            if (wv) deg += Math.sin(t * wv.freq + (wv.phase ?? 0)) * wv.amp;
            rs.angles[b.id] = clamp(deg, b.limits.min, b.limits.max);
          }
        };
        if (m.rigs) {
          for (const r of RIGS) applyHarmonic(r, m.rigs[r.id]);
        } else {
          applyHarmonic(RIGS[0], m);
        }
      }
    }

    function renderAll(t, px, py) {
      const sc = BLUEPRINT.scene;
      // Subtle organic cinematic camera breathing
      const cbx = state.camBreath ? Math.sin(t * 0.45) * 4.5 : 0;
      const cby = state.camBreath ? Math.cos(t * 0.35) * 2.5 : 0;
      const effPx = px + cbx * 0.04;
      const effPy = py + cby * 0.04;

      // 1. Sky + twinkling stars
      let skyHtml = sc.skySvg ?? `<rect x="-40" y="-40" width="1040" height="800" fill="${sc.bgColor ?? '#0b1326'}"/>`;
      if (STARS.length) {
        skyHtml += `<g transform="translate(${(effPx * 4).toFixed(1)}, ${(effPy * 4).toFixed(1)})">`;
        for (const s of STARS) {
          const op = clamp(s.op + Math.sin(t * s.freq + s.phase) * 0.25, 0.12, 1);
          skyHtml += `<circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="${s.r.toFixed(2)}" fill="${sc.stars.color ?? '#ffffff'}" opacity="${op.toFixed(2)}"/>`;
        }
        skyHtml += `</g>`;
      }
      document.getElementById('layerSky').innerHTML = skyHtml;

      // 2. Ambient Sky Effects (meteor & fireflies)
      let ambHtml = '';
      if (state.showAmbient && Array.isArray(sc.emitters)) {
        for (const em of sc.emitters) {
          if (em.type === 'meteor') {
            const local = (t * state.ambientAmp + (em.offset ?? 0)) % (em.period ?? 6);
            const dur = em.dur ?? 1.0;
            if (local <= dur) {
              const p = local / dur;
              const ease = 1 - Math.pow(1 - p, 2);
              const hx = em.x0 + em.dx * ease + effPx * 6;
              const hy = em.y0 + em.dy * ease + effPy * 6;
              const ang = Math.atan2(em.dy, em.dx) * RAD;
              const fade = p < 0.2 ? p / 0.2 : (p > 0.72 ? (1 - p) / 0.28 : 1);
              const len = (em.len ?? 110) * Math.sin(p * Math.PI);
              ambHtml += `
                <g transform="translate(${hx.toFixed(1)},${hy.toFixed(1)}) rotate(${ang.toFixed(1)})" opacity="${fade.toFixed(2)}">
                  <polygon points="${(-len).toFixed(1)},0 0,-2.6 0,2.6" fill="url(#${em.gradId ?? 'meteorTrail'})"/>
                  <path d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" fill="${em.color ?? '#fff7c2'}" filter="url(#softGlow)"/>
                </g>`;
            }
          } else if (em.type === 'fireflies') {
            const fr = makeRng(em.seed ?? 901);
            for (let i = 0; i < (em.count ?? 18); i++) {
              const bx = (em.xMin ?? 80) + fr() * ((em.xMax ?? 880) - (em.xMin ?? 80));
              const by = (em.yMin ?? 160) + fr() * ((em.yMax ?? 580) - (em.yMin ?? 160));
              const ph = fr() * 6.28;
              const fx = bx + Math.sin(t * 0.75 * state.ambientAmp + ph) * 28 + effPx * 14;
              const fy = by + Math.cos(t * 1.05 * state.ambientAmp + ph) * 18 + effPy * 11;
              const glow = 0.2 + 0.8 * Math.pow((Math.sin(t * 2.1 + ph) + 1) * 0.5, 2);
              ambHtml += `<circle cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="${(2.0 + glow * 2.6).toFixed(1)}" fill="${em.color ?? '#ffe985'}" opacity="${glow.toFixed(2)}" filter="url(#softGlow)"/>`;
            }
          }
        }
      }
      document.getElementById('layerAmbientBack').innerHTML = ambHtml;

      // 3. Concentric Celestial Rig
      let celHtml = '';
      if (sc.celestial) {
        const c = sc.celestial;
        const pulse = Math.sin(t * 1.3 * state.ambientAmp) * 0.032;
        celHtml += `<g transform="translate(${(c.x + effPx * 8).toFixed(1)}, ${(c.y + effPy * 8).toFixed(1)})">`;
        (c.rings ?? []).forEach((rg, idx) => {
          celHtml += `<circle cx="${(effPx * idx * 1.3).toFixed(1)}" cy="${(effPy * idx * 1.3).toFixed(1)}" r="${(rg.r * (1 + pulse * (0.6 + idx * 0.14))).toFixed(1)}" fill="${rg.fill}" filter="url(#shadowMed)"/>`;
        });
        celHtml += `<g transform="translate(${(effPx * 8).toFixed(1)}, ${(effPy * 8).toFixed(1)})">${c.coreSvg ?? ''}</g>`;
        if (c.orbitSvg) celHtml += `<g transform="rotate(${(t * (c.orbitSpeed ?? 12) * state.ambientAmp).toFixed(1)})">${c.orbitSvg}</g>`;
        celHtml += `</g>`;
      }
      document.getElementById('layerCelestial').innerHTML = celHtml;

      // 4. Cinematic Atmosphere (Volumetric Light Shafts, Horizon Mist, Fore Vignette)
      const atm = sc.atmosphere ?? {};
      document.getElementById('layerLightShafts').innerHTML = state.showAtmos && atm.lightShaftsSvg
        ? `<g transform="translate(${(effPx * 9).toFixed(1)}, ${(effPy * 6).toFixed(1)})" opacity="${(0.82 + Math.sin(t * 0.9) * 0.14).toFixed(2)}">${atm.lightShaftsSvg}</g>` : '';
      document.getElementById('layerMistMid').innerHTML = state.showAtmos && atm.midMistSvg ? atm.midMistSvg : '';
      document.getElementById('layerAtmosphereFore').innerHTML = state.showAtmos && atm.foregroundGlowSvg ? atm.foregroundGlowSvg : '';

      // 5. Back & Front Multiplane Scenery
      const renderPlaneList = (list) => (list ?? []).map((pl) => {
        const dx = effPx * (pl.parallax ?? 12) + (pl.swayAmp ? Math.sin(t * (pl.swayFreq ?? 1.5) * state.ambientAmp + (pl.phase ?? 0)) * pl.swayAmp : 0);
        const dy = effPy * ((pl.parallax ?? 12) * 0.7);
        return `<g transform="translate(${dx.toFixed(1)}, ${dy.toFixed(1)})" ${pl.filter ? `filter="url(#${pl.filter})"` : ''}>${pl.svg}</g>`;
      }).join('');
      document.getElementById('layerBackScenery').innerHTML = renderPlaneList(sc.backLayers);
      document.getElementById('layerFrontScenery').innerHTML = renderPlaneList(sc.frontLayers);

      // 6. Mini-Swarms (2-bone fish / flapping birds)
      let swBack = '', swFront = '';
      if (state.showSwarm && Array.isArray(sc.swarms)) {
        for (const sw of sc.swarms) {
          const span = 1060;
          const rawX = (sw.x0 + (sw.dir ?? 1) * t * (sw.speed ?? 55) * state.ambientAmp) % span;
          const x = (rawX < -50 ? rawX + span : rawX) - 50;
          let y = sw.y0 + Math.sin(t * 2.4 * state.ambientAmp + (sw.phase ?? 0)) * (sw.amp ?? 14);
          let pitch = Math.cos(t * 2.4 * state.ambientAmp + (sw.phase ?? 0)) * 11;
          if (sw.jump) {
            const jt = (t * state.ambientAmp + (sw.jumpOffset ?? 0)) % (sw.jumpPeriod ?? 6);
            if (jt < 1.4) {
              const u = jt / 1.4;
              y -= Math.sin(u * Math.PI) * (sw.jumpHeight ?? 80);
              pitch = -Math.cos(u * Math.PI) * 42;
            }
          }
          const wag = Math.sin(t * (sw.wagFreq ?? 13) * state.ambientAmp + (sw.phase ?? 0)) * (sw.wagAmp ?? 24);
          const ox = effPx * (sw.lane === 'front' ? 20 : 14);
          const oy = effPy * (sw.lane === 'front' ? 13 : 10);
          const item = `
            <g transform="translate(${(x + ox).toFixed(1)}, ${(y + oy).toFixed(1)}) scale(${(sw.dir ?? 1) * (sw.scale ?? 1)}, ${sw.scale ?? 1}) rotate(${pitch.toFixed(1)})" filter="url(#shadowSoft)">
              <g transform="translate(${sw.tailPivotX ?? -14}, ${sw.tailPivotY ?? 0}) rotate(${wag.toFixed(1)})">${sw.tailSvg}</g>
              ${sw.bodySvg}
            </g>`;
          if (sw.lane === 'front') swFront += item; else swBack += item;
        }
      }
      document.getElementById('layerSwarmBack').innerHTML = swBack;
      document.getElementById('layerSwarmFront').innerHTML = swFront;

      // 7. Falling Leaves / Petals / Snow (3D-tumble + wind drift across back & front lanes!)
      let fBack = '', fFront = '';
      if (state.showAmbient && FALLING_PARTICLES.length > 0) {
        for (const p of FALLING_PARTICLES) {
          const spanY = 780, spanX = 1120;
          const rawY = (p.y0 + t * p.vy * state.ambientAmp) % spanY;
          const y = (rawY < -30 ? rawY + spanY : rawY) - 30;
          const rawX = (p.x0 + t * p.vx * state.ambientAmp + Math.sin(t * p.swayFreq + p.phase) * p.swayAmp) % spanX;
          const x = (rawX < -60 ? rawX + spanX : rawX) - 60;
          const rot = (t * p.spinFreq * 45 + p.phase * 40) % 360;
          const flipX = 0.45 + 0.55 * Math.cos(t * p.tumbleFreq + p.phase);
          const pxMul = p.lane === 'front' ? 22 : 12;
          const item = `<g transform="translate(${(x + effPx * pxMul).toFixed(1)}, ${(y + effPy * pxMul * 0.7).toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${(p.scale * flipX).toFixed(2)}, ${p.scale.toFixed(2)})" filter="url(#shadowSoft)">${p.svg}</g>`;
          if (p.lane === 'front') fFront += item; else fBack += item;
        }
      }
      document.getElementById('layerFallingBack').innerHTML = fBack;
      document.getElementById('layerFallingFront').innerHTML = fFront;

      // 8. Ground Contact Shadows + Cohesive Silhouette Hero Rigs!
      let gsHtml = '', heroesHtml = '', diagHtml = '', ikHtml = '';
      const orderedRigs = [...RIGS].sort((a, b) => (a.z ?? 0) - (b.z ?? 0));

      for (const rigObj of orderedRigs) {
        const rs = rigStates[rigObj.id];
        const world = computeWorld(rigObj);
        const hox = effPx * (rigObj.parallax ?? 15);
        const hoy = effPy * ((rigObj.parallax ?? 15) * 0.75);

        // Dynamic Ground Contact Shadow (scales & softens with height!)
        if (rigObj.groundY != null) {
          const baseRootY = rigObj.rootPos?.y ?? rigObj.groundY - 50;
          const lift = Math.max(0, baseRootY - rs.rootY);
          const shScale = clamp(1 - lift / 220, 0.35, 1.05);
          const shOp = clamp(1 - lift / 240, 0.22, 1);
          const rx = (rigObj.shadowRx ?? 56) * shScale;
          const ry = (rigObj.shadowRy ?? 11) * shScale;
          gsHtml += `<ellipse cx="${(rs.rootX + hox + (rigObj.shadowOffsetX ?? 0)).toFixed(1)}" cy="${(rigObj.groundY + hoy).toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="url(#groundShadowGrad)" opacity="${shOp.toFixed(2)}"/>`;
        }

        // Cohesive silhouette shadow on the ENTIRE character group (eliminates plastic joint seams!)
        const groupShadow = rigObj.groupShadow === false ? '' : `filter="url(#${rigObj.groupShadow ?? 'shadowDeep'})"`;
        const sortedBones = [...rigObj.bones].sort((a, b) => (a.z ?? 0) - (b.z ?? 0));
        const pxFlip = rs.rootX;
        const brY = 1 + rs.breath;
        const brX = 1 - rs.breath * 0.5;

        heroesHtml += `<g ${groupShadow}><g transform="translate(${(pxFlip + hox).toFixed(1)}, ${(rs.rootY + hoy).toFixed(1)}) scale(${(rs.facing * brX).toFixed(3)}, ${brY.toFixed(3)}) translate(${(-pxFlip).toFixed(1)}, ${(-rs.rootY).toFixed(1)})" filter="url(#paperTex)">`;
        for (const b of sortedBones) {
          const w = world[b.id];
          const part = PART_BY_ID[resolvePartId(rigObj, b)];
          if (!part) continue;
          // Default to subtle internal crease (none or shadowInner) instead of heavy black shadowMed!
          const boneSh = b.shadow && b.shadow !== 'none' ? `filter="url(#${b.shadow})"` : '';
          heroesHtml += `<g transform="translate(${w.x.toFixed(2)}, ${w.y.toFixed(2)}) scale(${rs.scale}) rotate(${w.deg.toFixed(2)})" ${boneSh}>${part.svg}</g>`;
        }
        heroesHtml += `</g></g>`;

        // Gentle floating emotional cue (warm heart/sparkle during greeting beat!)
        if (rs.emote === 'warm' || rs.emote === 'heart') {
          const ex = rs.rootX + hox + (rs.facing * 26);
          const ey = rs.rootY + hoy - 68 - Math.sin(t * 3.2) * 8;
          const op = 0.65 + Math.sin(t * 4) * 0.3;
          heroesHtml += `<g transform="translate(${ex.toFixed(1)}, ${ey.toFixed(1)})" opacity="${op.toFixed(2)}" filter="url(#softGlow)">
            ${rs.emote === 'heart'
              ? '<path d="M0 5 C-8 -2 -10 -10 -4 -12 C-1 -13 0 -9 0 -9 C0 -9 1 -13 4 -12 C10 -10 8 -2 0 5 Z" fill="#ffb38a"/>'
              : '<path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#ffe98a"/>'}
          </g>`;
        }

        // Diagnostics for ALL rigs
        if (state.showBones || state.showAnchors) {
          diagHtml += `<g transform="translate(${(pxFlip + hox).toFixed(1)}, ${hoy.toFixed(1)}) scale(${rs.facing}, 1) translate(${(-pxFlip).toFixed(1)}, 0)">`;
          if (state.showBones) {
            const col = rigObj.id === state.activeRigId ? '#38bdf8' : '#a78bfa';
            for (const b of rigObj.bones) {
              if (!b.parent) continue;
              const p = world[b.parent], c = world[b.id];
              diagHtml += `<line x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${c.x.toFixed(1)}" y2="${c.y.toFixed(1)}" stroke="${col}" stroke-width="2" opacity="0.9"/>`;
            }
            for (const b of rigObj.bones) {
              const w = world[b.id];
              diagHtml += `<circle cx="${w.x.toFixed(1)}" cy="${w.y.toFixed(1)}" r="3.6" fill="#fff" stroke="${col}" stroke-width="1.8"/>`;
              diagHtml += `<text x="${(w.x + 6).toFixed(1)}" y="${(w.y - 4).toFixed(1)}" font-size="9.5" font-family="monospace" fill="#e0f2fe" font-weight="bold">${b.id}</text>`;
            }
          }
          if (state.showAnchors) {
            for (const b of rigObj.bones) {
              const part = PART_BY_ID[resolvePartId(rigObj, b)];
              const w = world[b.id];
              const rad = w.deg * DEG, cs = Math.cos(rad), sn = Math.sin(rad);
              for (const pt of Object.values(part?.anchors ?? {})) {
                const lx = (pt[0] - part.pivot[0]) * rs.scale, ly = (pt[1] - part.pivot[1]) * rs.scale;
                const wx = w.x + lx * cs - ly * sn, wy = w.y + lx * sn + ly * cs;
                diagHtml += `<circle cx="${wx.toFixed(1)}" cy="${wy.toFixed(1)}" r="3" fill="#f97316" stroke="#fff" stroke-width="1"/>`;
              }
            }
          }
          diagHtml += `</g>`;
        }

        // IK Handles for active rig
        if (rigObj.id === state.activeRigId && rigObj.ik) {
          for (const [ikId, ch] of Object.entries(rigObj.ik)) {
            const endW = world[ch.end];
            const hx = pxFlip + (endW.x - pxFlip) * rs.facing + hox;
            const hy = endW.y + hoy;
            ikHtml += `<g class="ik-handle" data-rig="${rigObj.id}" data-ik="${ikId}"><circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="8" fill="#ef4444" fill-opacity="0.32" stroke="#ef4444" stroke-width="2"/><circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="2.5" fill="#fff"/></g>`;
          }
        }
      }
      document.getElementById('layerGroundShadows').innerHTML = gsHtml;
      document.getElementById('layerHeroes').innerHTML = heroesHtml;
      document.getElementById('layerDiag').innerHTML = diagHtml;
      document.getElementById('layerIk').innerHTML = ikHtml;

      // 9. Dynamic VFX (splash, bubbles, warm meeting glow!)
      let vfxHtml = '';
      if (state.vfx.glowSpot > 0.04 && state.showAtmos) {
        vfxHtml += `<circle cx="${(state.vfx.glowX + effPx * 15).toFixed(1)}" cy="${(state.vfx.glowY + effPy * 11).toFixed(1)}" r="125" fill="url(#warmMomentGlow)" opacity="${state.vfx.glowSpot.toFixed(2)}"/>`;
      }
      if (state.vfx.splash > 0.04) {
        const s = state.vfx.splash, sy = sc.waterlineY ?? 516;
        vfxHtml += `<g transform="translate(${(state.vfx.splashX + effPx * 15).toFixed(1)}, ${(sy + effPy * 11).toFixed(1)})" opacity="${Math.min(1, s * 1.15).toFixed(2)}">
          <circle cx="${(-46 * s).toFixed(1)}" cy="${(-44 * s).toFixed(1)}" r="5" fill="#e6f7ff"/>
          <circle cx="${(-18 * s).toFixed(1)}" cy="${(-64 * s).toFixed(1)}" r="4.5" fill="#ffffff"/>
          <circle cx="${(22 * s).toFixed(1)}" cy="${(-60 * s).toFixed(1)}" r="5.5" fill="#e6f7ff"/>
          <circle cx="${(48 * s).toFixed(1)}" cy="${(-38 * s).toFixed(1)}" r="4" fill="#ffffff"/>
          <path d="M${(-64 * s).toFixed(1)} 4 Q0 ${(-24 * s).toFixed(1)} ${(64 * s).toFixed(1)} 4 Q0 ${(-8 * s).toFixed(1)} ${(-64 * s).toFixed(1)} 4 Z" fill="#d4f1ff" opacity="0.85"/>
        </g>`;
      }
      if (state.vfx.bubbles > 0.05) {
        const r0 = rigStates[RIGS[0].id];
        for (let i = 0; i < 6; i++) {
          const rise = (t * 48 + i * 24) % 90;
          const bx = r0.rootX - 28 + i * 15 + Math.sin(t * 4 + i) * 6 + effPx * 15;
          const by = (sc.waterlineY ?? 520) + 36 - rise + effPy * 11;
          vfxHtml += `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${(2.5 + (i % 3) * 1.3).toFixed(1)}" fill="#c8efff" opacity="${(state.vfx.bubbles * (1 - rise / 95) * 0.75).toFixed(2)}"/>`;
        }
      }
      document.getElementById('layerVfx').innerHTML = vfxHtml;

      // 10. Overlay Pendulum Props
      let ovHtml = '';
      for (const op of sc.overlayProps ?? []) {
        const ox = op.x + effPx * (op.parallax ?? 22) + Math.sin(t * (op.freqX ?? 0.8) * state.ambientAmp) * (op.ampX ?? 8);
        const oy = op.y + effPy * ((op.parallax ?? 22) * 0.8) + Math.cos(t * (op.freqY ?? 1.1) * state.ambientAmp) * (op.ampY ?? 6);
        const tilt = Math.sin(t * (op.freqX ?? 0.9) * state.ambientAmp) * (op.tiltAmp ?? 3.2);
        ovHtml += `<g transform="translate(${ox.toFixed(1)}, ${oy.toFixed(1)}) scale(${op.scale ?? 1}) rotate(${tilt.toFixed(2)})" filter="url(#shadowDeep)">${op.svg}</g>`;
      }
      document.getElementById('layerOverlayProps').innerHTML = ovHtml;
    }

    // Build Inspector UI (supports switching between multiple rigs!)
    const presetBar = document.getElementById('presetBar');
    for (const m of [...(BLUEPRINT.motions ?? []), { id: 'manual', name: '🎛️ Tự chỉnh Rig' }]) {
      const btn = document.createElement('button');
      btn.className = 'pill-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] font-medium';
      btn.dataset.preset = m.id;
      btn.dataset.active = String(m.id === state.preset);
      btn.textContent = m.name;
      btn.addEventListener('click', () => {
        state.preset = m.id;
        document.querySelectorAll('[data-preset]').forEach(x => x.dataset.active = String(x.dataset.preset === m.id));
        if (m.id === 'manual') document.getElementById('phaseBadge').textContent = '🎛️ Chế độ tự chỉnh từng khớp Rig';
      });
      presetBar.appendChild(btn);
    }

    if (RIGS.length > 1) {
      const sw = document.getElementById('rigSwitcher');
      sw.classList.remove('hidden');
      for (const r of RIGS) {
        const b = document.createElement('button');
        b.className = 'pill-btn px-2.5 py-1 rounded-md border border-[var(--border)] font-medium';
        b.dataset.rigbtn = r.id;
        b.dataset.active = String(r.id === state.activeRigId);
        b.textContent = `${r.label} (${r.bones.length} xương)`;
        b.addEventListener('click', () => {
          state.activeRigId = r.id;
          sw.querySelectorAll('button').forEach(x => x.dataset.active = String(x.dataset.rigbtn === r.id));
          rebuildRigInspector();
        });
        sw.appendChild(b);
      }
    }

    let sliderRefs = {};
    function rebuildRigInspector() {
      const rigObj = RIG_BY_ID[state.activeRigId];
      const rs = rigStates[rigObj.id];
      sliderRefs = {};

      // Variants
      const vs = document.getElementById('variantSection');
      vs.innerHTML = '';
      const varEntries = Object.entries(rigObj.variants ?? {});
      vs.classList.toggle('hidden', varEntries.length === 0);
      for (const [grp, opts] of varEntries) {
        const block = document.createElement('div');
        block.className = 'space-y-1';
        block.innerHTML = `<div class="font-semibold">${grp}</div><div class="flex flex-wrap gap-1"></div>`;
        const row = block.lastChild;
        for (const opt of opts) {
          const b = document.createElement('button');
          b.className = 'pill-btn px-2 py-1 rounded border border-[var(--border)]';
          b.dataset.active = String(rs.variants[grp] === opt);
          b.textContent = opt;
          b.addEventListener('click', () => {
            rs.variants[grp] = opt;
            row.querySelectorAll('button').forEach(x => x.dataset.active = String(x.textContent === opt));
          });
          row.appendChild(b);
        }
        vs.appendChild(block);
      }

      const addSlider = (parentEl, key, label, min, max, val, unit, onSet) => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-2';
        row.innerHTML = `<span class="w-32 truncate text-[var(--muted-foreground)]" title="${key}">${label}</span><input type="range" min="${min}" max="${max}" step="1" value="${val}" class="flex-1 accent-[var(--primary)]"/><span class="w-12 text-right font-mono tabular-nums">${Math.round(val)}${unit}</span>`;
        const inp = row.querySelector('input'), out = row.querySelectorAll('span')[1];
        inp.addEventListener('input', () => {
          state.preset = 'manual';
          document.querySelectorAll('[data-preset]').forEach(x => x.dataset.active = String(x.dataset.preset === 'manual'));
          onSet(Number(inp.value));
          out.textContent = `${Math.round(inp.value)}${unit}`;
        });
        parentEl.appendChild(row);
        sliderRefs[key] = { inp, out, unit };
      };

      const rootCtrl = document.getElementById('rootControls');
      rootCtrl.innerHTML = '';
      addSlider(rootCtrl, '__rootX', 'Vị trí X', 80, 880, rs.rootX, 'px', v => rs.rootX = v);
      addSlider(rootCtrl, '__rootY', 'Vị trí Y', 80, 680, rs.rootY, 'px', v => rs.rootY = v);

      const boneSliders = document.getElementById('boneSliders');
      boneSliders.innerHTML = '';
      for (const b of rigObj.bones) {
        addSlider(boneSliders, b.id, b.label ?? b.id, b.limits.min, b.limits.max, rs.angles[b.id], '°', v => rs.angles[b.id] = v);
      }
      updateSpecTab();
    }

    function syncSliders() {
      const rigObj = RIG_BY_ID[state.activeRigId];
      const rs = rigStates[rigObj.id];
      if (!sliderRefs.__rootX) return;
      sliderRefs.__rootX.inp.value = rs.rootX; sliderRefs.__rootX.out.textContent = `${Math.round(rs.rootX)}px`;
      sliderRefs.__rootY.inp.value = rs.rootY; sliderRefs.__rootY.out.textContent = `${Math.round(rs.rootY)}px`;
      for (const b of rigObj.bones) {
        const ref = sliderRefs[b.id];
        if (!ref) continue;
        ref.inp.value = rs.angles[b.id];
        ref.out.textContent = `${Math.round(rs.angles[b.id])}°`;
      }
    }

    function updateSpecTab() {
      const totalBones = RIGS.reduce((s, r) => s + r.bones.length, 0);
      document.getElementById('specSummary').innerHTML = `
        <div class="font-semibold">${BLUEPRINT.meta.title}</div>
        <div class="text-[var(--muted-foreground)]">${RIGS.length} nhân vật Rig · ${totalBones} xương · ${BLUEPRINT.parts.length} SVG parts · Seed ${BLUEPRINT.meta.seed ?? 4219}</div>`;
      const trees = RIGS.map((r) => {
        const fmt = (pid, pref) => r.bones.filter(b => b.parent === pid).map((k, i, arr) => {
          const last = i === arr.length - 1;
          return `${pref}${pid === null ? '' : (last ? '└─ ' : '├─ ')}${k.id} [${k.limits.min}°..${k.limits.max}°]\n` +
            fmt(k.id, pid === null ? ' ' : pref + (last ? '   ' : '│  '));
        }).join('');
        return `[${r.label}]\n` + fmt(null, '').trim();
      }).join('\n\n');
      document.getElementById('boneTreeOut').textContent = trees;
    }

    function updatePoseJson() {
      const out = {};
      for (const r of RIGS) {
        const rs = rigStates[r.id];
        const a = {};
        for (const b of r.bones) a[b.id] = Number(rs.angles[b.id].toFixed(1));
        out[r.id] = { root: { x: Math.round(rs.rootX), y: Math.round(rs.rootY) }, facing: rs.facing, angles: a };
      }
      document.getElementById('poseJsonOut').textContent = JSON.stringify(out, null, 2);
    }

    // Wire events
    document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('[data-tab]').forEach(b => b.dataset.active = String(b === btn));
      ['rig', 'scene', 'spec'].forEach(t => document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab));
      if (tab === 'spec') updatePoseJson();
    }));
    document.getElementById('btnCopyPose').addEventListener('click', () => { updatePoseJson(); navigator.clipboard?.writeText(document.getElementById('poseJsonOut').textContent); });
    document.getElementById('btnPlay').addEventListener('click', e => { state.playing = !state.playing; e.target.textContent = state.playing ? '⏸ Tạm dừng' : '▶ Phát'; });
    document.getElementById('btnFlip').addEventListener('click', () => { rigStates[state.activeRigId].facing *= -1; });
    document.getElementById('btnRest').addEventListener('click', () => {
      state.preset = 'manual';
      const r = RIG_BY_ID[state.activeRigId], rs = rigStates[r.id];
      for (const b of r.bones) rs.angles[b.id] = b.rest ?? 0;
      rs.rootX = r.rootPos?.x ?? 480; rs.rootY = r.rootPos?.y ?? 420;
      syncSliders();
    });
    document.getElementById('selSpeed').addEventListener('change', e => state.speed = Number(e.target.value));
    document.getElementById('chkBones').addEventListener('change', e => state.showBones = e.target.checked);
    document.getElementById('chkAnchors').addEventListener('change', e => state.showAnchors = e.target.checked);
    document.getElementById('chkParallax').addEventListener('change', e => state.parallax = e.target.checked);
    document.getElementById('chkAtmos').addEventListener('change', e => state.showAtmos = e.target.checked);
    document.getElementById('chkFrame').addEventListener('change', e => { state.showFrame = e.target.checked; document.getElementById('layerFrame').style.display = e.target.checked ? 'inline' : 'none'; });
    document.getElementById('chkCorners').addEventListener('change', e => { state.showCorners = e.target.checked; document.getElementById('layerCorners').style.display = e.target.checked ? 'inline' : 'none'; });
    document.getElementById('chkAmbient').addEventListener('change', e => state.showAmbient = e.target.checked);
    document.getElementById('chkSwarm').addEventListener('change', e => state.showSwarm = e.target.checked);
    document.getElementById('chkCamBreath').addEventListener('change', e => state.camBreath = e.target.checked);
    document.getElementById('rngAmbient').addEventListener('input', e => { state.ambientAmp = Number(e.target.value); document.getElementById('valAmbient').textContent = state.ambientAmp.toFixed(1) + '×'; });
    document.getElementById('rngShadow').addEventListener('input', e => {
      const v = Number(e.target.value); state.shadowScale = v;
      document.getElementById('valShadow').textContent = v.toFixed(1) + '×';
      document.getElementById('fDeep').setAttribute('stdDeviation', (9 * v).toFixed(1));
      document.getElementById('fDeep').setAttribute('dy', (8 * v).toFixed(1));
      document.getElementById('fMed').setAttribute('stdDeviation', (5.5 * v).toFixed(1));
    });

    const sceneSvg = document.getElementById('sceneSvg');
    const setZoom = (d) => {
      state.zoom = clamp(state.zoom + d, 0.7, 2.2);
      const w = 960 / state.zoom, h = 720 / state.zoom;
      sceneSvg.setAttribute('viewBox', `${(480 - w / 2).toFixed(1)} ${(360 - h / 2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
      document.getElementById('zoomLabel').textContent = `${Math.round(state.zoom * 100)}%`;
    };
    document.getElementById('btnZoomIn').addEventListener('click', () => setZoom(0.2));
    document.getElementById('btnZoomOut').addEventListener('click', () => setZoom(-0.2));

    sceneSvg.addEventListener('pointerdown', e => {
      const h = e.target.closest('.ik-handle');
      if (!h) return;
      state.draggingIk = { rigId: h.dataset.rig, ikId: h.dataset.ik };
      state.preset = 'manual';
      sceneSvg.setPointerCapture(e.pointerId);
    });
    sceneSvg.addEventListener('pointermove', e => {
      if (!state.draggingIk) return;
      const rigObj = RIG_BY_ID[state.draggingIk.rigId];
      const rs = rigStates[rigObj.id];
      const pt = sceneSvg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const sp = pt.matrixTransform(sceneSvg.getScreenCTM().inverse());
      const hox = state.smoothPtr.x * (rigObj.parallax ?? 15);
      const hoy = state.smoothPtr.y * ((rigObj.parallax ?? 15) * 0.75);
      const tx = rs.rootX + (sp.x - hox - rs.rootX) * rs.facing;
      const ty = sp.y - hoy;
      solveIk(rigObj, rigObj.ik[state.draggingIk.ikId], { x: tx, y: ty });
      syncSliders();
    });
    sceneSvg.addEventListener('pointerup', () => state.draggingIk = null);

    const stageWrap = document.getElementById('stageWrap');
    stageWrap.addEventListener('pointermove', e => {
      const r = stageWrap.getBoundingClientRect();
      state.pointer.x = ((e.clientX - r.left) / r.width - 0.5) * 2;
      state.pointer.y = ((e.clientY - r.top) / r.height - 0.5) * 2;
    });
    stageWrap.addEventListener('pointerleave', () => { state.pointer.x = 0; state.pointer.y = 0; });

    rebuildRigInspector();

    let last = performance.now();
    function tick(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      if (state.playing) {
        state.time += dt * state.speed;
        if (state.preset !== 'manual') {
          evalMotion(state.time);
          syncSliders();
        }
      }
      const tpx = state.parallax ? state.pointer.x : 0;
      const tpy = state.parallax ? state.pointer.y : 0;
      state.smoothPtr.x += (tpx - state.smoothPtr.x) * 0.08;
      state.smoothPtr.y += (tpy - state.smoothPtr.y) * 0.08;
      renderAll(state.time, state.smoothPtr.x, state.smoothPtr.y);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
